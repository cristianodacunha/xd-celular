<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/img/helmet-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>XD Catálogos</title>
</head>
<body>
  <main class="login-shell">
    <video class="intro-video" autoplay muted loop playsinline poster="assets/img/helmet-icon.png">
      <source src="assets/video/abertura.mp4" type="video/mp4">
    </video>
    <div class="veil"></div>
    <section class="login-card" aria-labelledby="titulo">
      <img class="helmet" src="assets/img/helmet-icon.png" alt="Capacete XD">
      <p class="eyebrow">XD CATÁLOGOS</p>
      <h1 id="titulo">Tudo para sua moto,<br>mesmo sem internet.</h1>
      <p class="subtitle">Entre para acessar seus catálogos baixados.</p>
      <form id="login-form">
        <label>E-mail<input type="email" autocomplete="email" placeholder="seu@email.com" required></label>
        <label>Senha<input type="password" autocomplete="current-password" placeholder="Sua senha" required></label>
        <button type="submit">Entrar</button>
      </form>
      <button class="link" type="button">Primeiro acesso ou recuperar senha</button>
      <p id="status" class="status">Após ativar, seus catálogos funcionam offline.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
